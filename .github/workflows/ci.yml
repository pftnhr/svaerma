name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repository. Deploy uses FTP secrets, not the token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, intl, mbstring
          coverage: none

      - name: Install dev tools
        # composer.lock is committed, so CI runs the exact same tool versions every time.
        run: composer install --no-interaction --no-progress

      - name: Lint
        run: find src public bin migrations templates tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Uploads only files tracked in git. Runtime files on the server
      # (config/config.php, data/*) are not in the repo and are never touched:
      # the action only deletes files it uploaded itself.
      - name: Deploy via FTPS
        # Pinned to a commit: this step receives the production FTP credentials.
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tests/**
            vendor/**
            composer.json
            composer.lock
            phpunit.xml
            phpstan.neon
            config/config.php
            data/*.sqlite
            data/backups/**
            data/sessions/**
            data/logs/**
            data/imports/**
